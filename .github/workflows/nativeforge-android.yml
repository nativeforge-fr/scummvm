name: Native Forge — Android APK (template)

# Builds the Versailles engine (cryomni3d/versailles) for Android arm64-v8a in
# ScummVM's official buildbot toolchain image, then packages the APK via Gradle.
# This APK is the TEMPLATE the installer fills with game data. Build log mirrored
# to the ci-logs branch (Actions logs need a token even on public repos).

on:
  workflow_dispatch:
  push:
    branches: [ versailles-fork ]
    paths:
      - '.github/workflows/nativeforge-android.yml'
      - 'dists/android/**'
      - 'backends/platform/android/**'
      - 'dists/nativeforge/importer/**'

permissions:
  contents: read

jobs:
  android:
    name: Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    container: scummvm/dockerized-toolchains:android
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build engine + APK
        id: build
        run: |
          set +e
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          {
            echo "=== configure (android-arm64-v8a, cryomni3d/versailles) ==="
            ./configure --host=android-arm64-v8a \
              --disable-all-engines --enable-engine=cryomni3d,versailles \
              --enable-release || { echo '--- config.log tail ---'; tail -n 50 config.log; exit 10; }
            echo "=== make (android host: builds native lib + Gradle APK) ==="
            make -j"$(nproc)" || exit 11
            echo "=== compile + bundle vfimport as libvfimport.so ==="
            NDK="${ANDROID_NDK_ROOT:-${ANDROID_NDK_HOME:-}}"
            CXX="$(ls "$NDK"/toolchains/llvm/prebuilt/*/bin/aarch64-linux-android*-clang++ 2>/dev/null | sort -V | head -1)"
            [ -z "$CXX" ] && CXX="$(grep -m1 -E '^CXX' config.mk | sed -E 's/^CXX *:?= *//')"
            echo "vfimport CXX=$CXX"
            "$CXX" -std=c++17 -O2 -fPIC \
              -o android_project/lib/arm64-v8a/libvfimport.so \
              dists/nativeforge/importer/vfimport.cpp || exit 20
            ls -l android_project/lib/arm64-v8a/
            echo "=== repackage APK with vfimport included ==="
            ( cd android_project && ./gradlew assembleDebug ) || exit 21
            cp android_project/build/outputs/apk/debug/ScummVM-debug.apk ScummVM-debug.apk
            echo "=== check libvfimport.so is packaged ==="
            unzip -l ScummVM-debug.apk | grep -i vfimport || echo "WARNING: vfimport missing from APK"
            echo "=== produced APK(s) ==="
            find . -maxdepth 4 -name '*.apk' -exec ls -lh {} \;
          } 2>&1 | tee /tmp/b.log
          # Success is judged on the APK actually existing (robust to shell quirks).
          if [ -f ScummVM-debug.apk ]; then echo "rc=0" >> "$GITHUB_OUTPUT"; else echo "rc=1" >> "$GITHUB_OUTPUT"; fi

      - name: Fail if the build failed
        if: steps.build.outputs.rc != '0'
        run: exit 1

      - name: Upload APK
        if: steps.build.outputs.rc == '0'
        uses: actions/upload-artifact@v4
        with:
          name: Versailles-Android-arm64-debug
          path: '**/*.apk'
          if-no-files-found: error
