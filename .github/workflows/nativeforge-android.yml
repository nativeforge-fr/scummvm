name: Native Forge — Android APK (template)

# Builds the Versailles engine (cryomni3d/versailles) for Android arm64-v8a in
# ScummVM's official buildbot toolchain image, then packages the APK via Gradle.
# This APK is the TEMPLATE the installer fills with game data. Build log mirrored
# to the ci-logs branch (Actions logs need a token even on public repos).

on:
  workflow_dispatch:
  push:
    branches: [ ports/android-arm64 ]
    paths:
      - '.github/workflows/nativeforge-android.yml'

permissions:
  contents: write

jobs:
  android:
    name: Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    container: scummvm/dockerized-toolchains:android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build engine + APK
        id: build
        run: |
          set +e
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          {
            echo "=== configure (android-arm64-v8a, cryomni3d/versailles) ==="
            ./configure --host=android-arm64-v8a \
              --disable-all-engines --enable-engine=cryomni3d,versailles \
              --enable-release || { echo '--- config.log tail ---'; tail -n 50 config.log; exit 10; }
            echo "=== make (native lib) ==="
            make -j"$(nproc)" || exit 11
            echo "=== make androiddebug (Gradle APK) ==="
            make androiddebug || exit 12
            echo "=== produced APK(s) ==="
            find . -maxdepth 4 -name '*.apk' -exec ls -lh {} \;
          } 2>&1 | tee /tmp/b.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Mirror build log to ci-logs branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.email "ci@nativeforge.local"
          git config --global user.name "NF CI"
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          tmp="$(mktemp -d)"; cd "$tmp"
          git clone --depth 1 --branch ci-logs "$url" r 2>/dev/null || { mkdir r; cd r; git init -q; git checkout -qb ci-logs; git remote add origin "$url"; cd ..; }
          cp /tmp/b.log r/android-apk.log
          cd r && git add -A && git commit -qm "android-apk $(date -u +%FT%TZ)" || true
          git push -q -f origin ci-logs

      - name: Fail if the build failed
        if: steps.build.outputs.rc != '0'
        run: exit 1

      - name: Upload APK
        if: steps.build.outputs.rc == '0'
        uses: actions/upload-artifact@v4
        with:
          name: Versailles-Android-arm64-debug
          path: '**/*.apk'
          if-no-files-found: error
