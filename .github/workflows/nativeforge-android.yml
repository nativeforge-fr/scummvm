name: Native Forge — Android APK (template)

# Phase 2a: build the standalone Versailles engine for Android (arm64-v8a) using
# ScummVM's official buildbot toolchain image (NDK + prebuilt Android deps).
# This run also dumps the container environment so the exact NDK/SDK/PREFIX paths
# are known for the next iteration (native build -> gradle APK -> branding).
#
# The finished APK is meant to be a TEMPLATE: the Windows installer injects the
# game data (extracted from the user's own ISO) into its assets and re-signs it.
# No game data is shipped here.

on:
  workflow_dispatch:
  push:
    branches: [ ports/android-arm64 ]
    paths:
      - '.github/workflows/nativeforge-android.yml'

permissions:
  contents: read

jobs:
  android:
    name: Android arm64-v8a (cryomni3d/versailles)
    runs-on: ubuntu-latest
    container: scummvm/dockerized-toolchains:android
    steps:
      - name: Discover container environment
        run: |
          echo "=== ENV ==="; env | sort
          echo "=== tools ==="
          for t in java clang++ aapt2 gradle make python3; do printf '%s: ' "$t"; command -v "$t" || echo '(absent)'; done
          java -version 2>&1 | head -1 || true
          echo "=== NDK/SDK ==="; echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"; echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "=== setenv scripts in image ==="; find / -maxdepth 6 -iname '*setenv*' 2>/dev/null | head
          echo "=== prebuilt android libs (freetype/sdl2 .pc) ==="; find / -maxdepth 8 -name 'sdl2.pc' -o -name 'freetype2.pc' 2>/dev/null | head

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (android-arm64-v8a, cryomni3d/versailles, standalone)
        continue-on-error: true
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          ./configure --host=android-arm64-v8a \
            --disable-all-engines --enable-engine=cryomni3d,versailles \
            --enable-release \
          || { echo '=== tail config.log ==='; tail -n 60 config.log; exit 1; }
          # Standalone (+ QoL) defines, as on Windows.
          sed -i '/VERSAILLES_STANDALONE/d' config.mk
          echo 'DEFINES += -DVERSAILLES_STANDALONE -DNDEBUG -DVERSAILLES_QOL' >> config.mk

      - name: Build native lib
        continue-on-error: true
        run: |
          make -j"$(nproc)" 2>&1 | tail -n 40
          echo "=== produced .so ==="; find . -maxdepth 3 -name 'lib*scummvm*.so' -o -name 'scummvm' -maxdepth 3 2>/dev/null | head
